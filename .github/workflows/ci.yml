name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payledger
          POSTGRES_PASSWORD: payledger
          POSTGRES_DB: payledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payledger" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://payledger:payledger@localhost:5432/payledger
